<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tally — Family Shopping List</title>
<link rel="stylesheet" href="fonts.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #E7E7EA;
    font-family: "Inter Tight", -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root { height: 100%; }
  .t-stage {
    height: 100%; width: 100%;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(120% 80% at 50% 0%, #F1F1F3 0%, #E4E4E8 55%, #DCDCE1 100%);
  }
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* ── Theme tokens ───────────────────────────────────── */
  .t-app {
    --bg:#FAFAF8; --surface:#FFFFFF; --surface2:#F3F3F1;
    --ink:#0B0E14; --ink2:#3A3F4A; --ink3:#7A808C; --ink4:#C2C6CE;
    --line:#E9E9EC; --line2:#F1F1F3;
    --win:#197A4F; --danger:#C0524E; --green:#2FAE66;
    position: relative; height: 100%; width: 100%;
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-size: 15px;
  }
  .t-app.dark {
    --bg:#0A0B0D; --surface:#15171B; --surface2:#1C1F25;
    --ink:#F3F4F6; --ink2:#AEB3BD; --ink3:#727781; --ink4:#454A53;
    --line:#24272D; --line2:#1B1E23;
    --win:#46C98A; --danger:#E0635E; --green:#2FAE66;
  }

  /* ── Header ─────────────────────────────────────────── */
  .t-header { flex-shrink: 0; padding: 56px 20px 14px; }
  .t-header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .t-avstack { display: inline-flex; align-items: center; background: none; border: 0; padding: 0; cursor: pointer; }
  .t-avatar {
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%; color: #fff; font-weight: 600;
    letter-spacing: .01em; flex-shrink: 0; font-feature-settings: "tnum";
  }
  .t-header-actions { display: flex; align-items: center; gap: 8px; }
  .t-sync { display: inline-flex; align-items: center; gap: 6px;
    font-family: "DM Mono", monospace; font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink3); }
  .t-live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 0 0 rgba(47,174,102,.5); animation: pulse 2.4s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(47,174,102,.45); }
    70% { box-shadow: 0 0 0 6px rgba(47,174,102,0); }
    100% { box-shadow: 0 0 0 0 rgba(47,174,102,0); }
  }
  .t-iconbtn { width: 40px; height: 40px; border: 0; background: transparent;
    color: var(--ink2); border-radius: 12px; display: inline-flex; align-items: center;
    justify-content: center; cursor: pointer; transition: background .15s; }
  .t-iconbtn:hover { background: var(--surface2); }
  .t-eyebrow { font-family: "DM Mono", monospace; font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink3); margin-bottom: 5px; }
  .t-title { margin: 0; font-family: "Barlow Condensed", sans-serif; font-weight: 600;
    font-size: 46px; line-height: .96; letter-spacing: -0.02em; color: var(--ink); }
  .t-summary { display: flex; align-items: center; gap: 8px; margin-top: 11px;
    font-size: 13px; color: var(--ink2); white-space: nowrap; }
  .t-summary-main { color: var(--ink); font-weight: 500; }
  .t-summary-sep { color: var(--ink4); }
  .t-summary-est { font-family: "DM Mono", monospace; font-size: 12.5px; color: var(--ink2); }

  /* ── List ───────────────────────────────────────────── */
  .t-list { flex: 1; overflow-y: auto; padding: 6px 20px 0; }
  .t-section { margin-top: 22px; }
  .t-section:first-child { margin-top: 6px; }
  .t-section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; padding: 0 2px; }
  .t-cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .t-cat-dot.sm { width: 7px; height: 7px; }
  .t-cat-name { font-size: 13px; font-weight: 600; letter-spacing: .01em; color: var(--ink); }
  .t-cat-name.muted { color: var(--ink3); }
  .t-cat-count { font-family: "DM Mono", monospace; font-size: 11px; color: var(--ink3); }
  .t-section-rule { flex: 1; height: 1px; background: var(--line); }
  .t-cat-total { font-family: "DM Mono", monospace; font-size: 11px; color: var(--ink3); }

  .t-rows { background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    overflow: hidden; }
  .t-row { position: relative; }
  .t-row + .t-row { border-top: 1px solid var(--line2); }
  .t-row.swipe { overflow: hidden; }
  .t-row-body { display: flex; align-items: center; gap: 13px; padding-left: 16px; padding-right: 16px;
    background: var(--surface); cursor: pointer; position: relative; z-index: 1; }
  .t-swipe-surface { position: relative; z-index: 1; }
  .t-row-main { min-width: 0; flex: 1; }
  .t-name { font-size: 16px; font-weight: 500; color: var(--ink); line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-name.bought { text-decoration: line-through; color: var(--ink3); text-decoration-thickness: 1px; }
  .t-meta { display: flex; align-items: center; gap: 7px; margin-top: 3px; min-width: 0; }
  .t-qty { font-family: "DM Mono", monospace; font-size: 11px; color: var(--ink2);
    background: var(--surface2); padding: 1px 6px; border-radius: 5px; white-space: nowrap; }
  .t-note { font-size: 12px; color: var(--ink3); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .t-note.dim { color: var(--ink4); }
  .t-dot-sep { color: var(--ink4); }
  .t-row-right { margin-left: auto; display: flex; align-items: center; gap: 11px; flex-shrink: 0; }
  .t-price { font-family: "DM Mono", monospace; font-size: 13px; font-weight: 500; color: var(--ink); }
  .t-price.guess { color: var(--ink3); font-weight: 400; }
  .t-price.bought { color: var(--ink4); text-decoration: line-through; }
  .t-row.is-bought .t-row-body { opacity: .62; }

  .t-check { border: 2px solid var(--ink4); border-radius: 50%; background: transparent;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    flex-shrink: 0; padding: 0; transition: background .18s, border-color .18s, transform .15s; }
  .t-check:active { transform: scale(.86); }
  .t-check.on { background: var(--chk); border-color: var(--chk); }

  .t-swipe-action { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; }
  .t-swipe-action.left { left: 0; width: 50%; background: var(--green); justify-content: flex-start; padding-left: 26px; }
  .t-swipe-action.right { right: 0; width: 50%; background: var(--danger); justify-content: flex-end; padding-right: 26px; }

  @keyframes arrive { from { background: var(--accent-soft, rgba(37,65,224,.10)); }
    to { background: var(--surface); } }
  .t-row.arrive .t-row-body { animation: arrive 1.2s ease-out; }

  .t-list-foot { height: 12px; }

  /* empty / done states */
  .t-empty, .t-allgood { display: flex; flex-direction: column; align-items: center;
    text-align: center; padding: 64px 32px; }
  .t-empty-mark { width: 76px; height: 76px; border-radius: 24px; border: 1.5px solid;
    display: flex; align-items: center; justify-content: center; margin-bottom: 22px; opacity: .9; }
  .t-empty-title, .t-allgood-t { font-family: "Barlow Condensed", sans-serif; font-weight: 600;
    font-size: 30px; letter-spacing: -0.01em; color: var(--ink); margin-bottom: 8px; }
  .t-empty-sub, .t-allgood-s { font-size: 14px; color: var(--ink3); line-height: 1.5; max-width: 270px; }
  .t-allgood { padding: 48px 32px; }
  .t-allgood-mark { width: 56px; height: 56px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; margin-bottom: 18px; }

  /* ── Toast ──────────────────────────────────────────── */
  .t-toast { position: absolute; left: 16px; right: 16px; bottom: 94px; z-index: 30;
    display: flex; align-items: center; gap: 11px; padding: 11px 14px;
    background: color-mix(in srgb, var(--surface) 80%, transparent);
    -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--line); border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,.16); animation: toastin .4s cubic-bezier(.22,1,.36,1); }
  @keyframes toastin { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .t-toast-txt { flex: 1; font-size: 13px; color: var(--ink2); }
  .t-toast-txt b { color: var(--ink); font-weight: 600; }

  /* ── Add bar ────────────────────────────────────────── */
  .t-addbar { flex-shrink: 0; display: flex; gap: 10px; padding: 12px 16px 28px;
    background: var(--bg); border-top: 1px solid var(--line2); }
  .t-addfield { flex: 1; height: 52px; border-radius: 16px; background: var(--surface2);
    border: 1px solid var(--line); display: flex; align-items: center; gap: 10px;
    padding: 0 16px; color: var(--ink3); font-size: 15px; font-family: inherit; cursor: pointer; }
  .t-addbtn { width: 52px; height: 52px; border-radius: 16px; border: 0; display: flex;
    align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 40%, transparent); }

  /* ── Sheets ─────────────────────────────────────────── */
  .t-sheet-wrap { position: absolute; inset: 0; z-index: 40; background: rgba(8,10,16,.34);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity .26s ease; }
  .t-sheet-wrap.open { opacity: 1; pointer-events: auto; }
  .t-sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface);
    border-radius: 28px 28px 0 0; padding: 10px 20px 30px; overflow-y: auto;
    transform: translateY(100%); transition: transform .34s cubic-bezier(.22,1,.36,1);
    box-shadow: 0 -10px 40px rgba(0,0,0,.22); }
  .t-sheet-wrap.open .t-sheet { transform: translateY(0); }
  .t-sheet-grip { width: 40px; height: 5px; border-radius: 3px; background: var(--ink4);
    opacity: .5; margin: 0 auto 16px; }
  .t-sheet-label { font-family: "DM Mono", monospace; font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink3); margin-bottom: 14px; }

  .t-input-lg { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent;
    font-family: "Inter Tight", sans-serif; font-size: 26px; font-weight: 500; color: var(--ink);
    outline: none; padding: 2px 0 14px; }
  .t-input-lg::placeholder { color: var(--ink4); }
  .t-cat-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 16px 20px;
    margin: 0 -20px; scrollbar-width: none; }
  .t-cat-chip { flex-shrink: 0; display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink2); font-size: 13px; font-family: inherit; cursor: pointer; transition: border-color .15s; }
  .t-cat-chip.on { font-weight: 600; }

  .t-field-row { display: flex; gap: 12px; margin-top: 6px; }
  .t-field { flex: 1; display: flex; flex-direction: column; gap: 7px; margin-top: 14px; }
  .t-field-l { font-family: "DM Mono", monospace; font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink3); }
  .t-field-row .t-field { margin-top: 0; }
  .t-input { width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface2); padding: 0 14px; font-size: 15px; font-family: inherit;
    color: var(--ink); outline: none; transition: border-color .15s; }
  .t-input:focus { border-color: var(--accent); }
  .t-input.price { display: flex; align-items: center; gap: 6px; padding: 0 12px; }
  .t-input.price .t-eur { color: var(--ink3); font-family: "DM Mono", monospace; flex-shrink: 0; }
  .t-input.price input { border: 0; background: transparent; flex: 1; min-width: 0; height: 100%;
    font-size: 15px; font-family: inherit; color: var(--ink); outline: none; }
  .t-price-hint { display: flex; align-items: center; gap: 7px; margin-top: 10px;
    font-size: 12.5px; color: var(--ink3); line-height: 1.4; }
  .t-sheet-actions { display: flex; gap: 10px; margin-top: 24px; }
  .t-btn { height: 52px; border-radius: 14px; border: 0; font-family: inherit; font-size: 15px;
    font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer; transition: opacity .15s, transform .1s; }
  .t-btn:active { transform: scale(.985); }
  .t-btn.primary { flex: 1; color: #fff; }
  .t-btn.primary:disabled { opacity: .4; cursor: default; }
  .t-btn.ghost { background: var(--surface2); color: var(--ink2); border: 1px solid var(--line); padding: 0 18px; }
  .t-btn.ghost.danger { color: var(--danger); }
  .t-btn.sm { height: 40px; font-size: 13px; border-radius: 11px; padding: 0 14px; font-weight: 500; }

  /* invite */
  .t-family-head { margin-bottom: 16px; }
  .t-family-name { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 30px;
    letter-spacing: -0.01em; color: var(--ink); }
  .t-family-name-btn { display: inline-flex; align-items: center; gap: 10px; background: none;
    border: 0; padding: 0; cursor: pointer; }
  .t-family-name-btn .t-family-name { text-align: left; }
  .t-family-input { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 30px;
    letter-spacing: -0.01em; color: var(--ink); background: transparent; border: 0;
    border-bottom: 2px solid var(--accent); outline: none; padding: 0 0 3px; width: 100%; }
  .t-family-sub { font-size: 13px; color: var(--ink3); margin-top: 2px; }
  .t-invite-card { display: flex; gap: 16px; align-items: center; padding: 16px;
    background: var(--surface2); border: 1px solid var(--line); border-radius: 18px; }
  .t-invite-qr { width: 88px; height: 88px; border-radius: 14px; background: var(--surface);
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .t-invite-right { flex: 1; display: flex; flex-direction: column; gap: 7px; align-items: flex-start; }
  .t-code { font-family: "DM Mono", monospace; font-size: 22px; letter-spacing: .1em; color: var(--ink); font-weight: 500; }
  .t-invite-hint { font-size: 13px; color: var(--ink3); line-height: 1.5; margin: 14px 0 18px; }
  .t-member-list { display: flex; flex-direction: column; }
  .t-member-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; }
  .t-member-row + .t-member-row { border-top: 1px solid var(--line2); }
  .t-member-info { flex: 1; }
  .t-member-name { font-size: 15px; font-weight: 500; color: var(--ink); display: flex; align-items: center; }
  .t-you-tag { font-family: "DM Mono", monospace; font-size: 9.5px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
    padding: 2px 6px; border-radius: 5px; margin-left: 8px; }
  .t-member-role { font-size: 12px; color: var(--ink3); margin-top: 1px; }
  .t-member-live { font-family: "DM Mono", monospace; font-size: 11px; color: var(--win); }

  /* settings screen */
  .t-screen { position: absolute; inset: 0; z-index: 50; background: var(--bg);
    display: flex; flex-direction: column; transform: translateX(100%);
    transition: transform .34s cubic-bezier(.22,1,.36,1); }
  .t-screen.open { transform: translateX(0); }
  .t-screen-bar { display: flex; align-items: center; justify-content: space-between;
    padding: 56px 12px 8px; flex-shrink: 0; }
  .t-screen-title { font-size: 17px; font-weight: 600; color: var(--ink); }
  .t-screen-body { flex: 1; overflow-y: auto; padding: 8px 20px 40px; }
  .t-set-group-l { font-family: "DM Mono", monospace; font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink3); margin: 20px 4px 8px; }
  .t-set-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .t-set-row { padding: 15px 16px; border-bottom: 1px solid var(--line2); display: flex; align-items: center; gap: 12px; }
  .t-set-row.col { flex-direction: column; align-items: stretch; gap: 11px; }
  .t-set-row.last { border-bottom: 0; }
  .t-set-row.tap { width: 100%; background: transparent; border-left: 0; border-right: 0; border-top: 0;
    cursor: pointer; text-align: left; }
  .t-set-row.tap:hover { background: var(--surface2); }
  .t-set-k { font-size: 15px; color: var(--ink); }
  .t-set-row.tap .t-set-k { flex: 1; }
  .t-set-row.col .t-set-k { font-size: 13px; color: var(--ink3); font-family: "DM Mono", monospace;
    letter-spacing: .04em; text-transform: uppercase; }
  .t-set-v { margin-left: auto; color: var(--ink3); font-size: 14px; }
  .t-set-v.mono { font-family: "DM Mono", monospace; font-size: 13px; }
  .t-set-row.about { justify-content: space-between; }

  .t-seg { display: flex; background: var(--surface2); border-radius: 11px; padding: 3px; }
  .t-seg-btn { flex: 1; border: 0; background: transparent; padding: 8px; border-radius: 8px;
    font-family: inherit; font-size: 13px; font-weight: 500; color: var(--ink3); cursor: pointer;
    transition: color .15s; }
  .t-seg-btn.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .t-app.dark .t-seg-btn.on { box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .t-swatches { display: flex; gap: 12px; }
  .t-swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--surface);
    box-shadow: 0 0 0 1px var(--line); display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform .12s; }
  .t-swatch.on { transform: scale(1.06); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink2); }
  .t-set-foot { font-size: 12px; color: var(--ink3); line-height: 1.55; padding: 16px 4px 0; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ios-frame.jsx?v=3"></script>
  <script type="text/babel" src="tweaks-panel.jsx?v=3"></script>
  <script type="text/babel" src="app/data.jsx?v=3"></script>
  <script type="text/babel" src="app/components.jsx?v=3"></script>
  <script type="text/babel" src="app/sheets.jsx?v=3"></script>
  <script type="text/babel" src="app/App.jsx?v=3"></script>
</body>
</html>
